[package]
name = "rust-calibre-mcp"
version = "0.4.0"
edition = "2021"
description = "L2 CLI + MCP 2024-11-05 stdio server for Calibre ebook libraries"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rust-calibre-mcp"
path = "src/main.rs"

[dependencies]
calibre-core = { path = "../calibre-core" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
